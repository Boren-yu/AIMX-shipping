<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<title>海运出运协同平台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js" integrity="sha384-8zg7Eb13Jv4vByCkXozj1LKSUykPghS+Zp1Q9BA8lYkMDbushxoDjh+RQ+4r1DNd" crossorigin="anonymous"></script>
<style>/* ============ Apple-style theme ============ */
:root{color-scheme:light;
  --bg:#F5F5F7;--surface:#FFFFFF;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.07);
  --ink:#1D1D1F;--muted:#6E6E73;--line:rgba(60,60,67,.12);--line-strong:rgba(60,60,67,.24);
  --brand:#0071E3;--brand-ink:#0066CC;--brand-wash:rgba(0,113,227,.10);--on-brand:#FFFFFF;--ring:rgba(0,113,227,.22);
  --red:#D70015;--red-solid:#FF3B30;--red-wash:rgba(255,59,48,.11);
  --amber:#C93400;--amber-solid:#FF9500;--amber-wash:rgba(255,149,0,.14);
  --ok:#248A3D;--ok-solid:#34C759;--ok-wash:rgba(52,199,89,.14);
  --link:#5856D6;--link-wash:rgba(88,86,214,.11);
  --material:rgba(245,245,247,.78);--sheet:#F2F2F7;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 4px 18px rgba(0,0,0,.05);
  --shadow-pop:0 24px 60px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Helvetica Neue","Segoe UI","Microsoft YaHei",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236E6E73' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --chev-on:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%230066CC' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --mag:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><circle cx='6' cy='6' r='4.6' fill='none' stroke='%236E6E73' stroke-width='1.5'/><path d='M9.5 9.5L13 13' stroke='%236E6E73' stroke-width='1.5' stroke-linecap='round'/></svg>");
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#000000;--surface:#1C1C1E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.14);
  --ink:#F5F5F7;--muted:#98989D;--line:rgba(84,84,88,.55);--line-strong:rgba(120,120,128,.6);
  --brand:#0A84FF;--brand-ink:#409CFF;--brand-wash:rgba(10,132,255,.18);--on-brand:#FFFFFF;--ring:rgba(10,132,255,.35);
  --red:#FF6961;--red-solid:#FF453A;--red-wash:rgba(255,69,58,.18);
  --amber:#FFB340;--amber-solid:#FF9F0A;--amber-wash:rgba(255,159,10,.18);
  --ok:#30D158;--ok-solid:#30D158;--ok-wash:rgba(48,209,88,.16);
  --link:#7D7AFF;--link-wash:rgba(94,92,230,.22);
  --material:rgba(22,22,24,.72);--sheet:#000000;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.35);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  --chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2398989D' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --chev-on:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23409CFF' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --mag:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><circle cx='6' cy='6' r='4.6' fill='none' stroke='%2398989D' stroke-width='1.5'/><path d='M9.5 9.5L13 13' stroke='%2398989D' stroke-width='1.5' stroke-linecap='round'/></svg>");}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#000000;--surface:#1C1C1E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.14);
  --ink:#F5F5F7;--muted:#98989D;--line:rgba(84,84,88,.55);--line-strong:rgba(120,120,128,.6);
  --brand:#0A84FF;--brand-ink:#409CFF;--brand-wash:rgba(10,132,255,.18);--on-brand:#FFFFFF;--ring:rgba(10,132,255,.35);
  --red:#FF6961;--red-solid:#FF453A;--red-wash:rgba(255,69,58,.18);
  --amber:#FFB340;--amber-solid:#FF9F0A;--amber-wash:rgba(255,159,10,.18);
  --ok:#30D158;--ok-solid:#30D158;--ok-wash:rgba(48,209,88,.16);
  --link:#7D7AFF;--link-wash:rgba(94,92,230,.22);
  --material:rgba(22,22,24,.72);--sheet:#000000;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.35);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  --chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2398989D' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --chev-on:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23409CFF' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --mag:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><circle cx='6' cy='6' r='4.6' fill='none' stroke='%2398989D' stroke-width='1.5'/><path d='M9.5 9.5L13 13' stroke='%2398989D' stroke-width='1.5' stroke-linecap='round'/></svg>");}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ---- header: translucent material ---- */
.top{position:sticky;top:0;z-index:20;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line-strong)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;row-gap:8px}
.top h1{margin:0 auto 0 0;font-size:17px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:980px;background:var(--fill);color:var(--muted);font-weight:500;letter-spacing:0}

/* ---- iOS segmented control (roles, language, tabs, add-mode) ---- */
.roles,.tabs{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0;position:relative}
.roles button,.tabs button{border:0;background:transparent;padding:5px 14px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s,box-shadow .15s}
.roles button[aria-pressed="true"],.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.10),0 1px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .roles button[aria-pressed="true"],:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:#636366}}
:root[data-theme="dark"] .roles button[aria-pressed="true"],:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:#636366}
.lang button{padding:5px 10px}
.tabs .n{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}

/* ---- tab row + search ---- */
.tabbar{display:flex;align-items:center;gap:12px;margin:22px 0 16px}
.tabs button{padding:6px 18px;font-size:14px}
#q{margin-left:auto;height:34px;font-size:14px;padding:0 12px 0 32px;border:0;border-radius:10px;background:var(--fill) var(--mag) no-repeat 11px center/14px 14px;color:var(--ink);width:280px;max-width:45%;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--muted)}
#q:focus{background-color:var(--surface);box-shadow:0 0 0 4px var(--ring)}
#q::-webkit-search-cancel-button{-webkit-appearance:none}

/* ---- summary tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{background:var(--surface);border:0;border-radius:18px;padding:16px 18px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-1px)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.tile .v{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);line-height:1.35}
.tile.red .v{color:var(--red-solid)}.tile.amber .v{color:var(--amber-solid)}.tile.todo .v{color:var(--brand)}
.hsum{display:flex;gap:36px;flex-wrap:wrap;background:var(--surface);border-radius:18px;padding:16px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.hsum div{display:flex;flex-direction:column;gap:2px}
.hsum b{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hsum span{font-size:12.5px;color:var(--muted)}

/* ---- filter bar ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.toolbar select{-webkit-appearance:none;appearance:none;height:32px;font-size:13px;font-weight:500;border:0;border-radius:980px;padding:0 25px 0 12px;background:var(--fill) var(--chev) no-repeat right 10px center/10px 6px;
  cursor:pointer;flex:none;max-width:240px;min-width:0;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;color:var(--ink)}
.toolbar select:hover{background-color:rgba(118,118,128,.18)}
.toolbar select.on{background-color:var(--brand-wash);background-image:var(--chev-on);color:var(--brand-ink);font-weight:600}
.clear{border:0;background:none;color:var(--brand-ink);cursor:pointer;font-size:13px;padding:0 6px;height:32px;white-space:nowrap;flex:none}
.clear:hover{text-decoration:underline}
.btn{border:0;border-radius:980px;height:32px;padding:0 16px;background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.toolbar .btn#addBtn{margin-left:auto;flex:none}
@media (max-width:900px){.toolbar{flex-wrap:wrap}}

/* ---- list (inset grouped) ---- */
.list{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:4px minmax(72px,1fr) minmax(122px,1fr) minmax(170px,1.1fr) minmax(78px,1fr) minmax(156px,1.05fr) 78px 78px 106px;gap:0 11px;align-items:center;padding:0 16px 0 0;min-height:58px;position:relative}
.row::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--line-strong);opacity:.7}
.row:last-child::after{display:none}
.row.head{min-height:36px;font-size:12px;color:var(--muted);font-weight:500}
.row.item{cursor:pointer;transition:background .12s}
.row.item:hover{background:var(--fill-2)}
.row.item:active{background:var(--fill)}
.row.mhead{display:flex!important;gap:10px;align-items:center;min-height:40px;padding:0 18px;background:var(--fill-2);font-weight:600;font-size:13.5px;letter-spacing:-.01em;cursor:default}
.mh-s{font-size:12.5px;color:var(--muted);font-weight:400}
.bar{align-self:stretch;margin:10px 0;border-radius:0 3px 3px 0}
.bar.red{background:var(--red-solid)}.bar.amber{background:var(--amber-solid)}
.cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-sup{font-weight:600;white-space:normal;line-height:1.3;font-size:13.5px;padding-left:12px}
.c-fw{white-space:normal;line-height:1.3;font-size:13px;color:var(--muted)}
.c-route{font-size:13px}
.c-po{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.po{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.01em}
.date{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.row.lk .c-sup{box-shadow:inset 3px 0 0 var(--link)}
.row.lk:not(.lk-last)::after{left:16px;background:var(--link);opacity:.25}
.ld{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:6px;background:var(--fill);color:var(--muted);font-weight:500;white-space:nowrap}
.ld.lcl{background:var(--link-wash);color:var(--link);font-weight:600}
.ld.plan{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.ld.new{background:var(--ok-wash);color:var(--ok);font-weight:600}
.ld.warn{background:var(--amber-wash);color:var(--amber);font-weight:600}
.trk{display:flex;align-items:center;gap:8px}
.dots{display:grid;grid-template-columns:repeat(4,15px);gap:3px}
.dots i{height:5px;border-radius:3px;background:var(--fill)}
.dots i.on{background:var(--brand)}
.dots.done i{background:var(--ok-solid)}
.trk span{font-size:13px;font-weight:600;white-space:nowrap}
.trk span.pre{color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:2px 9px;border-radius:980px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.red{background:var(--red-wash);color:var(--red)}
.pill.amber{background:var(--amber-wash);color:var(--amber)}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.na{background:var(--fill-2);color:var(--muted);font-weight:500}
.pick{width:17px;height:17px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--brand);cursor:pointer}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.more{display:block;width:100%;border:0;background:var(--surface);padding:14px;color:var(--brand-ink);cursor:pointer;font-weight:500}
.more:hover{background:var(--fill-2)}
.hint{font-size:12.5px;color:var(--muted);margin:12px 4px 0}
.note{font-size:12px;color:var(--muted);margin:14px 4px 36px}
.c-dates{display:none}
@media (max-width:1000px){
  .row.head{display:none}
  .row{grid-template-columns:4px 1fr auto;grid-template-areas:"bar sup delay" "bar po po" "bar route route" "bar trk trk" "bar dates dates";gap:5px 12px;padding:13px 16px 13px 0}
  .row .bar{grid-area:bar;margin:2px 0}.row .c-sup{grid-area:sup;font-size:15px}.row .c-po{grid-area:po}.row .c-delay{grid-area:delay;justify-self:end}
  .row .c-route{grid-area:route}.row .c-fw{display:none}.row .c-trk{grid-area:trk}
  .row .c-req,.row .c-eta{display:none}.row .c-dates{grid-area:dates;display:block!important;font-size:12px;color:var(--muted)}
  .row .c-po,.row .c-route,.row .c-trk,.row .c-dates{padding-left:12px}
}

/* ---- floating action bar & toast ---- */
.abar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:rgba(29,29,31,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:#F5F5F7;border-radius:980px;padding:8px 8px 8px 20px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-pop);max-width:calc(100% - 32px);flex-wrap:wrap;font-size:13.5px}
.abar .w{font-size:12.5px;color:#FFB340}
.abar button{border:0;border-radius:980px;height:32px;padding:0 16px;cursor:pointer;font-weight:600;font-size:13px}
.abar .go{background:#0A84FF;color:#fff}
.abar .go:disabled{opacity:.4;cursor:not-allowed}
.abar .no{background:rgba(255,255,255,.14);color:#F5F5F7}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:rgba(29,29,31,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#F5F5F7;padding:10px 18px;border-radius:980px;font-size:13px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow-pop)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- sheet / drawer ---- */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.22);z-index:40;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.scrim.open{display:block}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(520px,calc(100% - 20px));background:var(--sheet);z-index:50;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .32s cubic-bezier(.32,.72,0,1)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.toast,.tile{transition:none}}
@media (max-width:600px){.drawer{top:0;right:0;bottom:0;left:0;width:100%;border-radius:0}}
.dh{padding:16px 18px 14px;display:flex;gap:12px;align-items:flex-start;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line-strong)}
.dh h2{margin:0;font-size:19px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em}
.dh .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.x{margin-left:auto;border:0;background:var(--fill);border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:13px;flex:none}
.x:hover{background:rgba(118,118,128,.2)}
.db{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.df{padding:12px 16px;background:var(--material);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line-strong);display:flex;gap:10px;align-items:center}
.df .btn{height:36px;padding:0 20px;font-size:14px}
.bigtrk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border-radius:14px;padding:14px 14px 10px}
.bigtrk div{font-size:12px;color:var(--muted);text-align:center}
.bigtrk i{display:block;height:6px;border-radius:3px;background:var(--fill);margin-bottom:7px}
.bigtrk .on i{background:var(--brand)}.bigtrk .on{color:var(--ink)}
.bigtrk .cur{font-weight:600}
.bigtrk.done i{background:var(--ok-solid)}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.banner b{display:block;font-size:14px;font-weight:600;margin-bottom:1px}
.banner.red{background:var(--red-wash);color:var(--red)}.banner.amber{background:var(--amber-wash);color:var(--amber)}
.banner.ok{background:var(--ok-wash);color:var(--ok)}.banner.na{background:var(--surface);color:var(--muted)}
.sec{background:var(--surface);border-radius:14px;padding:14px}
.sec h4{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.own{font-size:11px;padding:1px 8px;border-radius:980px;background:var(--fill-2);color:var(--muted);font-weight:500}
.own.me{background:var(--brand-wash);color:var(--brand-ink);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld .ro{padding:8px 11px;border-radius:10px;background:var(--fill-2);min-height:36px;font-size:13.5px;line-height:20px}
.fld input,.fld select,textarea[data-a]{width:100%;padding:0 11px;height:36px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:13.5px;transition:box-shadow .15s,border-color .15s}
.fld select{-webkit-appearance:none;appearance:none;padding-right:30px;background:var(--surface) var(--chev) no-repeat right 12px center/10px 6px}
.fld input:focus,.fld select:focus,textarea[data-a]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.fld.wide{grid-column:1/-1}
textarea[data-a]{height:auto;min-height:150px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical;color:var(--ink)}
.log{list-style:none;margin:0;padding:0 0 0 16px;border-left:1.5px solid var(--line-strong)}
.log li{position:relative;padding:0 0 12px;font-size:12.5px}
.log li:last-child{padding-bottom:0}
.log li::before{content:"";position:absolute;left:-21.5px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--surface)}
.log li.chg::before{background:var(--amber-solid)}
.log .when{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.box{border-radius:12px;overflow:hidden;background:var(--fill-2)}
.box-h{display:flex;gap:8px;align-items:center;padding:10px 12px;font-size:13px;font-weight:600;flex-wrap:wrap}
.box-i{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border:0;border-top:.5px solid var(--line-strong);font-size:12.5px;cursor:pointer;background:none;width:100%;text-align:left}
.box-i:hover{background:var(--fill-2)}
.box-i.me{background:var(--brand-wash);cursor:default}
.wn{font-size:12.5px;color:var(--amber);background:var(--amber-wash);border-radius:12px;padding:10px 12px;line-height:1.45}
.ghost{border:0;background:var(--fill);border-radius:980px;height:32px;padding:0 16px;cursor:pointer;font-weight:600;font-size:13px;color:var(--brand-ink)}
.ghost:hover{background:rgba(118,118,128,.2)}
.ghost.dng{color:var(--red)}
.df .ghost{height:36px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.seg{align-self:flex-start}
.cols{display:flex;flex-wrap:wrap;gap:5px 6px;font-size:12px;color:var(--muted)}
.cols span{background:var(--surface);border-radius:6px;padding:2px 8px}
.msg{font-size:12.5px}.msg.err{color:var(--red)}.msg.okm{color:var(--ok)}.msg.wm{color:var(--amber)}
.db > .hint,.db > .grid,.db > .box,.db > .cols,.db > textarea{margin-top:0}
.db > .grid{background:var(--surface);border-radius:14px;padding:14px}

/* ---- phones ---- */
@media (max-width:600px){
  .tabbar{flex-wrap:wrap;margin:16px 0 12px}
  .tabbar .tabs{flex:1 1 100%}
  .tabbar .tabs button{flex:1}
  #q{flex:1 1 100%;width:auto;max-width:none;margin:2px 0 0}
  .toolbar select{flex:1 1 calc(50% - 4px);width:auto!important;max-width:none}
  .toolbar .clear{flex:1 1 100%;text-align:left}
  .toolbar .btn#addBtn{flex:1 1 100%;margin-left:0;height:38px}
  .roles{flex:1 1 auto}.roles button{flex:1}
  .tile .v{font-size:28px}
}

/* ---- company logo in header ---- */
.logo{display:flex;align-items:center;flex:none;background:#FFFFFF;border-radius:9px;padding:2px 7px;box-shadow:0 0 0 .5px var(--line-strong),0 1px 2px rgba(0,0,0,.05)}
.logo img{height:34px;width:auto;display:block}
.vsep{width:1px;height:24px;background:var(--line-strong);flex:none}
@media (max-width:600px){.logo img{height:28px}.vsep{height:20px}.top h1{font-size:16px}}
.drawer.open ~ .toast{bottom:84px}

/* 两类报警卡片：红 / 黄 两个数字 */
.tile.pair .v{display:flex;align-items:baseline;gap:6px}
.tile.pair .v .r{color:var(--red-solid);font-weight:600}
.tile.pair .v .a{color:var(--amber-solid);font-weight:600}
.tile.pair .v .sl{font-style:normal;color:var(--line-strong);font-weight:300;font-size:26px}
.tile .l b{color:var(--ink);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:11px;padding:2px 8px;border-radius:980px;background:var(--fill)}
.sync.saving{color:var(--amber-solid)}.sync.err{color:var(--red-solid);background:var(--red-wash)}
.me-chip{font-size:13px;font-weight:600;padding:4px 12px}
.gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.gcard{max-width:520px;width:100%;background:var(--surface);border-radius:18px;padding:28px;box-shadow:var(--shadow);text-align:center}
.gcard h2{margin:0 0 8px;font-size:20px}
@media (max-width:760px){.who #who{display:none}}

.tender{display:none}
main.tender-mode > :not(.tabbar):not(#tender),main.audit-mode > :not(.tabbar):not(#audit){display:none!important}
main.tender-mode #q,main.audit-mode #q{display:none}
main.tender-mode #tender,main.audit-mode #audit{display:block;margin-top:12px}
.tframe{width:100%;border:0;border-radius:18px;background:#fff;min-height:600px;display:block;box-shadow:var(--shadow)}

.signout{font:inherit;font-size:12px;padding:3px 10px;border-radius:980px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);cursor:pointer}
.signout:hover{color:var(--ink);background:var(--fill-2)}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none;flex-shrink:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs > button{flex-shrink:0;white-space:nowrap}

/* 每月中标详情 */
.tt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tt-bar select,.tt-bar input{font:inherit;font-size:14px;border:0;background:var(--fill);border-radius:10px;padding:8px 12px;color:var(--ink)}
.tt-bar input{flex:1 1 220px;min-width:0}
.tt-seg{flex-wrap:wrap}
.tt-seg button{padding:5px 12px;font-size:13px}
.tt-sum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:14px 0 10px;font-size:13px;color:var(--muted)}
.tt-sum > b{color:var(--ink);font-size:15px}
.tt-fw{background:var(--surface);border:1px solid var(--line);border-radius:980px;padding:1px 10px;color:var(--ink)}
.tt-wrap{overflow-x:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.tt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tt th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tt .n{text-align:right;white-space:nowrap}
.tt-g td{background:var(--fill-2);font-size:13px;padding:8px 12px}
.tt-r{cursor:pointer}
.tt-r:hover td,.tt-r.open td{background:var(--brand-wash)}
.tt-r:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.tt-lane{min-width:180px;max-width:300px}
.tt-lane b{display:block;font-weight:600}
.tt-lane span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-tot b{font-weight:700}
.tt-d{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.tt-d.up{color:var(--red)}.tt-d.dn{color:var(--ok)}
.tt-tr{white-space:nowrap;color:var(--muted)}
.tt-win{font-weight:600;min-width:90px}
.tt-x td{background:var(--fill-2);padding:12px 16px 14px}
.tt-x p{margin:6px 0 0;font-size:12.5px;overflow-wrap:anywhere}
.tt-fees{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tt-fees div{background:var(--surface);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.tt-fees span{font-size:11px;color:var(--muted)}
.tt-fees b{font-size:14px}
@media (max-width:760px){.tt-h{display:none}.tt-lane{min-width:140px}.tt td,.tt th{padding:8px}}

@media (max-width:760px){
  .tt thead{display:none}
  .tt,.tt tbody{display:block}
  .tt tr.tt-g,.tt tr.tt-x{display:block}
  .tt tr.tt-g td,.tt tr.tt-x td{display:block}
  .tt-r{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lane tot" "win sea";gap:2px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tt-r td{display:block;border:0;padding:0;background:transparent!important}
  .tt-r.open,.tt-r:hover{background:var(--brand-wash)}
  .tt-r .tt-h,.tt-r .tt-dem{display:none}
  .tt-r .tt-lane{grid-area:lane;min-width:0;max-width:none}
  .tt-r .tt-tot{grid-area:tot}
  .tt-r .tt-tot .tt-d{text-align:right}
  .tt-r .tt-win{grid-area:win;min-width:0;font-size:12.5px}
  .tt-r .tt-sea{grid-area:sea;font-size:12px;color:var(--muted)}
  .tt-r .tt-win::before,.tt-r .tt-sea::before{content:attr(data-l) " ";font-weight:400;color:var(--muted)}
}

a.btn{text-decoration:none}

.au-h{font-size:15px;margin:18px 0 8px}
.au-d{font-size:12.5px;min-width:220px}
.au-d div{overflow-wrap:anywhere}
</style>

    const x = auPlain(a[k]), y = auPlain(b[k]); if (String(x) !== String(y)) ch.push([k, x, y]);
  });
  const last = (arr, n) => (b[arr] || []).length > (a[arr] || []).length ? b[arr][b[arr].length - 1] : null;   // 新追加的变更原因
  const er = last('etaLog'); if (er && er.reason && prevJson) ch.push(['reason', '', er.reason]);
  const pr = last('editLog'); if (pr && pr.why) ch.push(['reason', '', pr.why]);
  if (!ch.length) return;
  const target = j.kind === 'L' ? (b.po || j.id) + (b.sup ? ' · ' + b.sup : '') : j.id + (b.fwd ? ' · ' + b.fwd : '');
  audit(prevJson ? 'edit' : 'create', target, { k: j.kind, id: j.id, ch });
}
async function flush() {
  if (!ME) return;
  if (flushing) { flushAgain = true; return; }
  flushing = true;
  try {
    let jobs;
    while ((jobs = dirty()).length) {
      setSync('saving');
      for (const j of jobs) { const prev = SAVED.get(j.kind + ':' + j.id); const r = await Store.put(j); SAVED.set(j.kind + ':' + j.id, { itemId: r.itemId, etag: r.etag, json: j.json }); logChange(j, prev && prev.json); }
    }
    setSync('ok');
  } catch (e) {
    if (e.conflict) {                            // 别人刚改过同一条：以服务器为准刷新
      setSync('ok'); await load(); flushing = false;
      if (cur) closeDrawer(); renderAll(); toast(t('conflict')); return;
    }
    if (e.message === 'redirect') return;
    console.error(e); setSync('err'); setTimeout(() => { flushing = false; flush(); }, 15000); return;
  }
  flushing = false;
  if (flushAgain) { flushAgain = false; flush(); }
}
async function refresh() {                       // 定时 / 回到页面时拉取别人的修改（编辑中不打扰）
  if (!ME || cur || flushing || dirty().length || Date.now() - lastLoad < 60000) return;
  try { await load(); renderAll(); } catch (e) { console.error(e); }
}
window.addEventListener('beforeunload', e => { if (ME && (flushing || dirty().length)) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- 启动：登录 → 权限 → 读数据 ---------- */
function gate(html) { $('gate').innerHTML = html; $('gate').classList.toggle('hidden', !html); }
async function boot() {
  applyStatic();
  gate(`<div class="gcard"><p>${t('gLoading')}</p></div>`);
  try {
    const me = await Store.signIn();
    if (!me) return;                             // 正在跳转登录
    if (me.signedOut) {
      gate(`<div class="gcard"><h2>${t('gSignedOut')}</h2><p><button class="btn" id="relogin">${t('gSignIn')}</button></p></div>`);
      $('relogin').onclick = () => Store.signInAgain(); return;
    }
    if (me.setup) return showSetup(me);
    if (!me.role || !ROLE_KEYS.includes(me.role)) return gate(`<div class="gcard"><h2>${t('gNoAccess')}</h2><p>${esc(t('gNoAccessTxt', me.email))}</p></div>`);
    ME = me; role = me.role;
    if (QS.has('reimport')) { if (!me.admin) return gate(`<div class="gcard"><h2>${t('gNoAccess')}</h2></div>`); await load(); return showReimport(me); }
    $('signout').onclick = async () => {
      if ((flushing || dirty().length) && !confirm(t('signOutUnsaved'))) return;
      ME = null; await Store.signOut();
    };
    await Promise.all([load().catch(e => { e.message = '[读取台账] ' + e.message; throw e; }), Store.getFile('Portal/awards.json').then(j => { if (j) AW = JSON.parse(j); }).catch(e => console.warn('awards', e))]);
    gate('');
    try { sessionStorage.removeItem('ship-relogin'); } catch (e) {}   // 正常进入后，下次再遇到 401 仍可自动重新登录
    let logged = false; try { logged = sessionStorage.getItem('ship-login') === ME.email; sessionStorage.setItem('ship-login', ME.email); } catch (e) {}
    if (!logged) audit('login', '', null);
    renderAll();
    setInterval(refresh, 180000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  } catch (e) {
    if (e.message === 'redirect') return;
    console.error(e);
    const siteUrl = 'https://' + CFG.site.replace(':', '');
    const is401 = /\b401\b/.test(e.message) && /读取站点|读取列表/.test(e.message);
    if (is401) {   // 外部来宾：SharePoint 要先在浏览器里打开过一次站点，才认得这个来宾
      gate(`<div class="gcard"><h2>${t('g401Title')}</h2><p>${t('g401Txt')}</p>
        <p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"><a class="btn" href="${esc(siteUrl)}" target="_blank" rel="noopener">${t('gOpenSite')}</a><button class="ghost" id="greload">${t('gReload')}</button></p>
        <p class="muted" style="font-size:12px;margin-top:12px">${esc(e.message)} · ${esc(Store.who || '')}</p></div>`);
      $('greload').onclick = () => location.reload(); return;
    }
    gate(`<div class="gcard"><h2>${t('gError')}</h2><p class="muted">${esc(e.message)}</p><p class="muted" style="font-size:12px">${esc(Store.who || '')}</p><p style="display:flex;gap:8px;justify-content:center"><button class="btn" id="grelogin">${t('gSignIn')}</button><button class="ghost" id="gout">${t('signOut')}</button></p></div>`);
    const go = $('gout'); if (go) go.onclick = () => Store.signOut();
    const gr = $('grelogin'); if (gr) gr.onclick = () => Store.signInAgain ? Store.signInAgain() : location.reload();
  }
}
function showSetup(me) {
  gate(`<div class="gcard"><h2>首次初始化</h2>
    <p>将向三张列表（${Object.values(LISTS).join(' / ')}）导入迁移数据，并把你（${esc(me.email)}）设为管理员。列表里原有的示例行会被清除。</p>
    <p><input type="file" id="seedf" accept=".json"></p><p><button class="btn" id="seedgo">开始初始化</button></p><pre id="seedlog" class="muted" style="white-space:pre-wrap;font-size:12px"></pre></div>`);
  $('seedgo').onclick = async () => {
    const f = $('seedf').files[0]; if (!f) return alert('请选择迁移数据文件');
    const L = m => $('seedlog').textContent += m + '\n';
    $('seedgo').disabled = true;
    try { await Store.setup(JSON.parse(await f.text()), me, L); L('完成，正在进入系统…'); setTimeout(() => location.reload(), 1200); }
    catch (e) { L('✗ ' + e.message); $('seedgo').disabled = false; }
  };
}

boot();

// 重新导入迁移数据（只换需求和订舱，人员名单不动）。执行前列出上线以来在平台上做过的修改。
function showReimport(me) {
  const touched = [];
  rows.forEach(o => {
    const why = [];
    if (o.editLog && o.editLog.length) why.push('计划员修改 ' + o.editLog.length + ' 处');
    if (o.note) why.push('跟进说明');
    if (o.closed || o.closedAt) why.push('已闭环');
    if (o.deleted) why.push('已删除');
    if (!/^L\d{4}$/.test(o.id)) why.push('上线后新增的需求');
    if (why.length) touched.push(`${o.po}（${o.sup}）：${why.join('、')}`);
  });
  Object.values(B).forEach(b => {
    const why = [];
    const live = (b.etaLog || []).filter(e => e.reason !== '迁移数据');
    if (live.length) why.push('ETA 记录 ' + live.length + ' 条');
    if (b.reassign && b.reassign.length) why.push('改派货代');
    if (!/^B\d{3}$/.test(b.id)) why.push('上线后新建的订舱');
    if (b.lastBy) why.push('最后由 ' + b.lastBy + ' 更新');
    if (why.length) touched.push(`订舱 ${b.id}（${b.fwd || '—'}）：${why.join('、')}`);
  });
  gate(`<div class="gcard" style="max-width:640px;text-align:left"><h2>重新导入迁移数据</h2>
    <p>将清空 ShipLines 和 ShipBookings，用所选文件重新导入。<b>人员名单 ShipUsers 不受影响。</b></p>
    <p style="margin-top:10px"><b>上线以来在平台上做过的修改（${touched.length} 处），重新导入后会丢失：</b></p>
    <pre class="muted" style="white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto;background:var(--fill-2);padding:10px;border-radius:10px">${esc(touched.join('\n') || '（没有）')}</pre>
    <p style="margin-top:10px"><input type="file" id="seedf" accept=".json"></p>
    <p><label><input type="checkbox" id="seedok"> 我已确认上面的修改可以丢弃</label></p>
    <p style="margin-top:10px"><button class="btn" id="seedgo">重新导入</button></p><pre id="seedlog" class="muted" style="white-space:pre-wrap;font-size:12px"></pre></div>`);
  $('seedgo').onclick = async () => {
    const f = $('seedf').files[0]; if (!f) return alert('请选择迁移数据文件');
    if (!$('seedok').checked) return alert('请先勾选确认');
    const L = m => $('seedlog').textContent += m + '\n';
    $('seedgo').disabled = true; ME = null;
    try { await Store.setup(JSON.parse(await f.text()), me, L, { keepUsers: true }); L('完成，正在进入系统…'); setTimeout(() => location.replace(location.pathname), 1200); }
    catch (e) { L('✗ ' + e.message); $('seedgo').disabled = false; }
  };
}

</script>
